{% extends 'base.html' %}{% block content %}<div class="form-page"><form method="post" class="card"><div class="card-body p-4"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3">{% if not equipment %}<div class="col-md-6"><label class="form-label">Equipment ID</label><input class="form-control" name="equipment_code" placeholder="Auto-generated if blank"></div>{% endif %}<div class="col-md-6"><label class="form-label">Equipment Name</label><input class="form-control" name="name" value="{{ equipment.name if equipment else '' }}" required></div><div class="col-md-6"><label class="form-label">Type</label><input class="form-control" name="type" value="{{ equipment.type if equipment else '' }}" required></div><div class="col-md-6"><label class="form-label">Building</label><select class="form-select" name="building_id" required>{% for b in buildings %}<option value="{{ b.id }}" {{ 'selected' if equipment and b.id==equipment.building_id }}>{{ b.name }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Location</label><input class="form-control" name="location" value="{{ equipment.location if equipment else '' }}" required></div>{% if not equipment %}<div class="col-md-6"><label class="form-label">Initial Status</label><select class="form-select" name="status"><option>Normal</option><option>Critical</option></select></div>{% endif %}</div></div><div class="card-footer d-flex justify-content-end gap-2"><a class="btn btn-outline-secondary" href="{{ url_for('core.equipment_list') }}">Cancel</a><button class="btn btn-primary">Save Equipment</button></div></form></div>{% endblock %}
