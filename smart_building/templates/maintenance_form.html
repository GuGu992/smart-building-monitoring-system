{% extends 'base.html' %}{% block content %}<div class="form-page"><form method="post" class="card"><div class="card-body p-4"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label">Equipment or Sensor</label><select class="form-select" name="target" required><option value="">Choose an item</option><optgroup label="Equipment">{% for e in equipment %}<option value="equipment:{{ e.id }}" {{ 'selected' if prefill_equipment and prefill_equipment|int==e.id }}>{{ e.equipment_code }} · {{ e.name }} · {{ e.building_name }}</option>{% endfor %}</optgroup><optgroup label="Environmental Sensors">{% for s in sensors %}<option value="sensor:{{ s.id }}" {{ 'selected' if prefill_sensor and prefill_sensor|int==s.id }}>{{ s.sensor_code }} · {{ s.sensor_type }} · {{ s.building_name }}</option>{% endfor %}</optgroup></select></div><div class="mb-3"><label class="form-label">Issue</label><textarea class="form-control" name="issue" required maxlength="1000">{{ prefill_issue or '' }}</textarea></div><div class="row g-3"><div class="col-md-6"><label class="form-label">Priority</label><select class="form-select" name="priority">{% for p in priorities %}<option>{{ p }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Assigned Staff</label><select class="form-select" name="assigned_staff_id"><option value="">Unassigned</option>{% for person in staff %}<option value="{{ person.id }}">{{ person.staff_code }} · {{ person.display_name }}</option>{% endfor %}</select></div></div><div class="mt-3"><label class="form-label">Notes</label><textarea class="form-control" name="notes" maxlength="1000">{{ prefill_notes or '' }}</textarea></div></div><div class="card-footer text-end"><a class="btn btn-outline-secondary" href="{{ url_for('core.maintenance_list') }}">Cancel</a> <button class="btn btn-primary">Create Maintenance</button></div></form></div>{% endblock %}
