{% extends 'base.html' %}
{% block unauthenticated %}
<main class="login-page">
  <div class="card login-card border-0 shadow-sm">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4"><div class="login-logo mx-auto mb-3"><i class="bi bi-buildings"></i></div><h1 class="h4">Smart Building Monitoring</h1><p class="text-body-secondary mb-0">Authorised staff access</p></div>
      {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3"><label class="form-label" for="username">Username</label><input class="form-control" id="username" name="username" required autofocus autocomplete="username"></div>
        <div class="mb-4"><label class="form-label" for="password">Password</label><input class="form-control" id="password" type="password" name="password" required autocomplete="current-password"></div>
        <button class="btn btn-primary w-100">Sign In</button>
      </form>
    </div>
  </div>
</main>
{% endblock %}
