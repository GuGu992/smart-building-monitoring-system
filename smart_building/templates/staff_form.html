{% extends 'base.html' %}{% block content %}<div class="form-page"><form method="post" class="card"><div class="card-body p-4"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label">Staff ID</label><input class="form-control" name="staff_code" placeholder="ST-003" required></div><div class="mb-3"><label class="form-label">Display Name</label><input class="form-control" name="display_name" required></div><div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" required></div><div class="mb-3"><label class="form-label">Temporary Password</label><input class="form-control" name="password" type="password" minlength="8" required></div><div class="form-check"><input class="form-check-input" type="checkbox" name="active" id="active" checked><label class="form-check-label" for="active">Active account</label></div></div><div class="card-footer text-end"><a class="btn btn-outline-secondary" href="{{ url_for('admin.staff_list') }}">Cancel</a> <button class="btn btn-primary">Save Staff</button></div></form></div>{% endblock %}
